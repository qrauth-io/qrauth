<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Concept E3: Navy filled shield, white QR grid + checkmark inside -->
  <!-- App icon style — solid, confident, high contrast -->

  <!-- Shield filled -->
  <path d="M48 20 H152 Q168 20 168 36 V108 Q168 158 100 186 Q32 158 32 108 V36 Q32 20 48 20 Z"
        fill="#081b4c"/>

  <!-- QR module grid (white, subtle) -->
  <g fill="#FFFFFF" opacity="0.18">
    <rect x="50" y="36" width="18" height="18" rx="3"/>
    <rect x="76" y="36" width="18" height="18" rx="3"/>
    <rect x="128" y="36" width="18" height="18" rx="3"/>
    <rect x="50" y="62" width="18" height="18" rx="3"/>
    <rect x="102" y="62" width="18" height="18" rx="3"/>
    <rect x="141" y="62" width="18" height="18" rx="3"/>
    <rect x="76" y="88" width="18" height="18" rx="3"/>
    <rect x="128" y="88" width="18" height="18" rx="3"/>
    <rect x="50" y="114" width="18" height="18" rx="3"/>
    <rect x="102" y="114" width="18" height="18" rx="3"/>
    <rect x="128" y="114" width="18" height="18" rx="3"/>
    <rect x="72" y="140" width="18" height="18" rx="3"/>
    <rect x="102" y="140" width="18" height="18" rx="3"/>
  </g>

  <!-- Bold checkmark (white, hero) -->
  <path d="M62 102 L88 132 L144 60"
        fill="none" stroke="#FFFFFF" stroke-width="15"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
